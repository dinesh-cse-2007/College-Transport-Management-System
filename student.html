<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard - College Transport</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f6f9;
        color: #222;
      }

      header {
        background: #2563eb;
        color: white;
        padding: 18px 35px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      header h2 {
        font-size: 22px;
      }

      header div {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      #welcomeStudent {
        font-size: 15px;
        font-weight: bold;
      }

      .logout {
        background: white;
        color: #2563eb;
        border: none;
        padding: 9px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }

      .logout:hover {
        background: #e5e7eb;
      }

      main {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
      }

      main > h1 {
        font-size: 30px;
        margin-bottom: 8px;
      }

      .gray {
        color: #6b7280;
        margin-bottom: 25px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 30px;
      }

      .card {
        background: white;
        padding: 22px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      .card h3 {
        font-size: 30px;
        margin-bottom: 10px;
      }

      .card p {
        color: #6b7280;
        margin-bottom: 8px;
      }

      .card h2 {
        color: #2563eb;
      }

      section {
        background: white;
        padding: 25px;
        margin-bottom: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
      }

      section h2 {
        margin-bottom: 18px;
        color: #111827;
      }

      #routeSearch {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        margin-bottom: 20px;
        font-size: 15px;
      }

      .route-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }

      .route-card {
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 18px;
        background: #f9fafb;
      }

      .route-card h3 {
        color: #2563eb;
        margin-bottom: 10px;
      }

      .route-card p {
        margin: 7px 0;
        color: #4b5563;
      }

      .pass {
        border: 2px solid #2563eb;
        border-radius: 10px;
        padding: 20px;
        background: #eff6ff;
      }

      .pass h3 {
        color: #2563eb;
        margin-bottom: 12px;
      }

      .pass p {
        margin: 8px 0;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-weight: bold;
        margin-top: 8px;
      }

      select,
      textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        font-size: 15px;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      form button {
        margin-top: 12px;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
      }

      form button:hover {
        background: #1d4ed8;
      }

      .complaint {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 12px;
        background: #f9fafb;
      }

      .complaint strong {
        color: #111827;
      }

      .status {
        display: inline-block;
        margin-top: 8px;
        padding: 5px 10px;
        border-radius: 15px;
        background: #fef3c7;
        color: #92400e;
        font-size: 13px;
        font-weight: bold;
      }

      .empty {
        color: #6b7280;
        text-align: center;
        padding: 15px;
      }

      @media (max-width: 900px) {
        .cards {
          grid-template-columns: repeat(2, 1fr);
        }
        .route-container {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 600px) {
        header {
          padding: 15px;
          flex-direction: column;
          gap: 12px;
        }
        main {
          margin: 20px auto;
        }
        .cards {
          grid-template-columns: 1fr;
        }
        .route-container {
          grid-template-columns: 1fr;
        }
        main > h1 {
          font-size: 25px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h2>🚌 College Transport</h2>

      <div>
        <span id="welcomeStudent">Welcome, Student</span>
        <button onclick="logout()" class="logout">Logout</button>
      </div>
    </header>

    <main>
      <h1>Student Dashboard</h1>

      <p class="gray">Manage your college transportation</p>

      <!-- DASHBOARD CARDS -->

      <div class="cards">
        <div class="card">
          <h3>🚌</h3>
          <p>Total Buses</p>
          <h2 id="totalBuses">0</h2>
        </div>

        <div class="card">
          <h3>📍</h3>
          <p>Total Routes</p>
          <h2 id="totalRoutes">0</h2>
        </div>

        <div class="card">
          <h3>🎫</h3>
          <p>Pass Status</p>
          <h2 id="passStatus">Active</h2>
        </div>

        <div class="card">
          <h3>⚠️</h3>
          <p>Complaints</p>
          <h2 id="totalComplaints">0</h2>
        </div>
      </div>

      <!-- BUS ROUTES -->

      <section>
        <h2>Available Bus Routes</h2>

        <input
          type="text"
          id="routeSearch"
          placeholder="Search route..."
          onkeyup="showStudentRoutes()"
        />

        <div id="studentRoutes"></div>
      </section>

      <!-- TRANSPORT PASS -->

      <section>
        <h2>My Transport Pass</h2>

        <div id="transportPass"></div>
      </section>

      <!-- SUBMIT COMPLAINT -->

      <section>
        <h2>Submit Complaint</h2>

        <form id="complaintForm">
          <label for="complaintType"> Complaint Type </label>

          <select id="complaintType" required>
            <option value="">Select type</option>

            <option value="Bus Delay">Bus Delay</option>

            <option value="Driver Issue">Driver Issue</option>

            <option value="Bus Condition">Bus Condition</option>

            <option value="Route Issue">Route Issue</option>

            <option value="Other">Other</option>
          </select>

          <label for="complaintBus"> Bus Number </label>

          <select id="complaintBus" required>
            <option value="">Select bus</option>
          </select>

          <label for="complaintDescription"> Description </label>

          <textarea
            id="complaintDescription"
            placeholder="Enter complaint"
            required
          ></textarea>

          <button type="submit">Submit Complaint</button>
        </form>
      </section>

      <!-- MY COMPLAINTS -->

      <section>
        <h2>My Complaints</h2>

        <div id="myComplaints"></div>
      </section>
    </main>

    <script>
      /* =====================================
                       SAMPLE TRANSPORT DATA
                    ===================================== */

      const buses = [
        {
          number: "BUS-101",
          route: "Chennai Central - College",
          driver: "Mr. Kumar",
          time: "7:30 AM",
        },
        {
          number: "BUS-102",
          route: "Tambaram - College",
          driver: "Mr. Ravi",
          time: "7:45 AM",
        },
        {
          number: "BUS-103",
          route: "Avadi - College",
          driver: "Mr. Suresh",
          time: "7:15 AM",
        },
        {
          number: "BUS-104",
          route: "Velachery - College",
          driver: "Mr. Arun",
          time: "8:00 AM",
        },
        {
          number: "BUS-105",
          route: "Guindy - College",
          driver: "Mr. Raj",
          time: "7:50 AM",
        },
        {
          number: "BUS-106",
          route: "Porur - College",
          driver: "Mr. Mani",
          time: "7:40 AM",
        },
      ];

      /* =====================================
             STUDENT DATA
          ===================================== */

      let studentName = localStorage.getItem("studentName") || "Student";

      /* =====================================
             COMPLAINT DATA
          ===================================== */

      let complaints =
        JSON.parse(localStorage.getItem("studentComplaints")) || [];

      /* =====================================
             DISPLAY STUDENT NAME
          ===================================== */

      function showStudentName() {
        const welcome = document.getElementById("welcomeStudent");

        welcome.textContent = "Welcome, " + studentName;
      }

      /* =====================================
             DISPLAY DASHBOARD COUNTS
          ===================================== */

      function updateDashboard() {
        document.getElementById("totalBuses").textContent = buses.length;

        document.getElementById("totalRoutes").textContent = buses.length;

        document.getElementById("totalComplaints").textContent =
          complaints.length;
      }

      /* =====================================
             SHOW BUS ROUTES
          ===================================== */

      function showStudentRoutes() {
        const container = document.getElementById("studentRoutes");

        const search = document
          .getElementById("routeSearch")
          .value.toLowerCase()
          .trim();

        const filteredBuses = buses.filter(function (bus) {
          return (
            bus.number.toLowerCase().includes(search) ||
            bus.route.toLowerCase().includes(search) ||
            bus.driver.toLowerCase().includes(search)
          );
        });

        if (filteredBuses.length === 0) {
          container.innerHTML = '<p class="empty">No routes found.</p>';

          return;
        }

        container.innerHTML =
          '<div class="route-container">' +
          filteredBuses
            .map(function (bus) {
              return `

            <div class="route-card">

              <h3>🚌 ${escapeHTML(bus.number)}</h3>

              <p>
                <strong>Route:</strong>
                ${escapeHTML(bus.route)}
              </p>

              <p>
                <strong>Driver:</strong>
                ${escapeHTML(bus.driver)}
              </p>

              <p>
                <strong>Departure:</strong>
                ${escapeHTML(bus.time)}
              </p>

            </div>

          `;
            })
            .join("") +
          "</div>";
      }

      /* =====================================
             LOAD BUS NUMBERS INTO COMPLAINT FORM
          ===================================== */

      function loadComplaintBuses() {
        const select = document.getElementById("complaintBus");

        buses.forEach(function (bus) {
          const option = document.createElement("option");

          option.value = bus.number;

          option.textContent = bus.number + " - " + bus.route;

          select.appendChild(option);
        });
      }

      /* =====================================
             DISPLAY TRANSPORT PASS
          ===================================== */

      function showTransportPass() {
        const pass = document.getElementById("transportPass");

        pass.innerHTML = `

        <div class="pass">

          <h3>🎫 Active Transport Pass</h3>

          <p>
            <strong>Student:</strong>
            ${escapeHTML(studentName)}
          </p>

          <p>
            <strong>Pass ID:</strong>
            CT-${Math.floor(100000 + Math.random() * 900000)}
          </p>

          <p>
            <strong>Status:</strong>
            Active
          </p>

          <p>
            <strong>Valid Until:</strong>
            31 March 2027
          </p>

        </div>

      `;
      }

      /* =====================================
             SUBMIT COMPLAINT
          ===================================== */

      document
        .getElementById("complaintForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const type = document.getElementById("complaintType").value;

          const bus = document.getElementById("complaintBus").value;

          const description = document
            .getElementById("complaintDescription")
            .value.trim();

          if (!type || !bus || !description) {
            alert("Please fill all complaint fields.");

            return;
          }

          const complaint = {
            id: Date.now(),

            student: studentName,

            type: type,

            bus: bus,

            description: description,

            status: "Pending",

            date: new Date().toLocaleString(),
          };

          complaints.push(complaint);

          localStorage.setItem("studentComplaints", JSON.stringify(complaints));

          alert("Complaint submitted successfully!");

          document.getElementById("complaintForm").reset();

          showComplaints();

          updateDashboard();
        });

      /* =====================================
             SHOW MY COMPLAINTS
          ===================================== */

      function showComplaints() {
        const container = document.getElementById("myComplaints");

        if (complaints.length === 0) {
          container.innerHTML =
            '<p class="empty">You have not submitted any complaints.</p>';

          return;
        }

        container.innerHTML = complaints
          .map(function (complaint) {
            return `

            <div class="complaint">

              <p>
                <strong>Complaint Type:</strong>
                ${escapeHTML(complaint.type)}
              </p>

              <p>
                <strong>Bus:</strong>
                ${escapeHTML(complaint.bus)}
              </p>

              <p>
                <strong>Description:</strong>
                ${escapeHTML(complaint.description)}
              </p>

              <p>
                <strong>Date:</strong>
                ${escapeHTML(complaint.date)}
              </p>

              <span class="status">
                ${escapeHTML(complaint.status)}
              </span>

            </div>

          `;
          })
          .join("");
      }

      /* =====================================
             LOGOUT
          ===================================== */

      function logout() {
        const confirmLogout = confirm("Are you sure you want to logout?");

        if (!confirmLogout) {
          return;
        }

        localStorage.removeItem("studentName");

        /*
                  Change this page name if your
                  login page has another filename.
                */

        window.location.href = "login.html";
      }

      /* =====================================
             SECURITY / HTML ESCAPING
          ===================================== */

      function escapeHTML(value) {
        return String(value)
          .replace(/&/g, "&amp;")

          .replace(/</g, "&lt;")

          .replace(/>/g, "&gt;")

          .replace(/"/g, "&quot;")

          .replace(/'/g, "&#039;");
      }

      /* =====================================
             PAGE INITIALIZATION
          ===================================== */

      function initializeDashboard() {
        showStudentName();

        updateDashboard();

        showStudentRoutes();

        loadComplaintBuses();

        showTransportPass();

        showComplaints();
      }

      /*
            Start dashboard
          */

      initializeDashboard();
    </script>
  </body>
</html>
```
